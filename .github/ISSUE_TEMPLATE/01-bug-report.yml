name: Bug report
description: Report reproducible behavior that is incorrect or unexpected.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Judge. Please include a minimal reproduction when possible.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the incorrect behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest code sample and steps that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain what you expected Judge to do instead.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Judge version, Node version, operating system, transport or gateway, and model.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Remove credentials and sensitive context before sharing output.
      render: shell
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add anything else that may help diagnose the issue.
